version: '3.8'

services:
  database:
    image: postgres:15-alpine
    container_name: toh-postgres
    restart: always
    environment:
      POSTGRES_USER: toh_user
      POSTGRES_PASSWORD: toh_secure_password
      POSTGRES_DB: token_of_halawa
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: toh-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: toh-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - PORT=5000
      - DATABASE_URL=postgresql://toh_user:toh_secure_password@database:5432/token_of_halawa?schema=public
      - JWT_SECRET=supersecuretokenofhalawaaccesssecretkey9911
      - JWT_REFRESH_SECRET=supersecuretokenofhalawarefreshsecretkey9911
      - REDIS_URL=redis://redis:6379
    depends_on:
      - database
      - redis

volumes:
  postgres_data:
  redis_data:
